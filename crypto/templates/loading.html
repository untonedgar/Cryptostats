<!DOCTYPE html>
<html>
<head>
    <title>Обновление балансов</title>
    <meta http-equiv="refresh" content="2">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <h2>Обновление балансов...</h2>
        <div class="spinner"></div>
        <p>Пожалуйста, подождите. Это займет несколько секунд.</p>
        <p class="small">Задача: {{ task_id|truncatechars:8 }}</p>
    </div>
</body>
</html>
